apiVersion: v1
kind: Service
metadata:
  name: {{ include "pangolin.name" . }}-api
  labels:
    {{- include "pangolin.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: {{ .Values.service.port | quote }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "pangolin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pangolin.name" . }}-worker-metrics
  labels:
    {{- include "pangolin.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /
    prometheus.io/port: "8001"
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "pangolin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
