{{- if .Values.gpuBatch.enabled }}
{{- if not .Values.gpuBatch.runId }}
{{- fail "gpuBatch.runId must be unique for each submitted batch job" }}
{{- end }}
{{- if not .Values.gpuBatch.image }}
{{- fail "gpuBatch.image is required when GPU batch processing is enabled" }}
{{- end }}
{{- if not .Values.gpuBatch.command }}
{{- fail "gpuBatch.command is required when GPU batch processing is enabled" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9-]+$" .Values.gpuBatch.runId) }}
{{- fail "gpuBatch.runId may contain only lowercase letters, digits, and hyphens" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pangolin.name" . }}-gpu-{{ .Values.gpuBatch.runId | trunc 20 | trimSuffix "-" }}
  labels:
    {{- include "pangolin.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpu-batch
  annotations:
    helm.sh/resource-policy: keep
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pangolin.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gpu-batch
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.batchName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bioinformatics
          image: {{ .Values.gpuBatch.image | quote }}
          command:
            {{- toYaml .Values.gpuBatch.command | nindent 12 }}
          {{- with .Values.gpuBatch.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.gpuBatch.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: sku
          operator: Equal
          value: gpu
          effect: NoSchedule
{{- end }}
