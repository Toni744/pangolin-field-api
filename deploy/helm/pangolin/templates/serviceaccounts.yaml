apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.apiName }}
  labels:
    {{- include "pangolin.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "serviceAccount.apiClientId is required" .Values.serviceAccount.apiClientId | quote }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.workerName }}
  labels:
    {{- include "pangolin.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "serviceAccount.workerClientId is required" .Values.serviceAccount.workerClientId | quote }}
automountServiceAccountToken: true
